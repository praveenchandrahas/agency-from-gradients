[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermodynamic-emergence-ledger"
version = "0.1.0"
description = "A zero-dimensional stellar-planetary energy, exergy and radiation-entropy ledger"
readme = "models/stellar_planet/README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
authors = [{ name = "Thermodynamic Emergence Research" }]

[project.scripts]
planetary-ledger = "thermodynamic_emergence.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
