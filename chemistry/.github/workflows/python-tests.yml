name: Python model tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run planetary baseline calculation
        run: python -m thermodynamic_emergence
      - name: Run chemical network baselines
        run: |
          chemical-network
          raf-network --compare
      - name: Run catalyst-removal recovery sweep
        run: raf-network --perturb-sweep --json
      - name: Run open-reactor baseline
        run: open-reactor
      - name: Run open-reactor matched-flow comparison
        run: open-reactor --compare
      - name: Run open-reactor catalyst-removal recovery sweep
        run: open-reactor --perturb-sweep --duration 300 --dt 0.005 --perturbation-time 150 --json
      - name: Run open-reactor positive-seed limit sweep
        run: open-reactor --seed-sweep --duration 300 --dt 0.005 --perturbation-time 150 --removal 0.99 --json
      - name: Run open-reactor washout and removal map
        run: open-reactor --washout-sweep --duration 300 --dt 0.005 --perturbation-time 150 --json
      - name: Run open-reactor horizon sensitivity
        run: open-reactor --horizon-sweep --duration 300 --dt 0.005 --perturbation-time 150 --removal 0.99 --json
