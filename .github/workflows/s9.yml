name: s9
# Confirmatory s9 (PREREGISTRATION_S9.md). Trigger: Actions -> s9 -> Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        arm: ["off", "energy", "heat"]
        seed0: [0, 5, 10, 15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Run
        run: python -m agency_gradients.experiments.s9_learning --seed0 ${{ matrix.seed0 }} --seeds 5 --only "${{ matrix.arm }}" --long-steps 100000 --scale 2 --workers 4 --out out
      - name: Publish results to the ci-results branch
        if: always()
        run: |
          set -e
          D="s9/${GITHUB_RUN_ID}-${{ matrix.arm }}-${{ matrix.seed0 }}"
          mkdir -p /tmp/res/$D && cp -r out/. /tmp/res/$D/
          git config --global user.name "github-actions"; git config --global user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            rm -rf /tmp/pub && git clone --quiet "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/pub
            cd /tmp/pub
            if git ls-remote --exit-code --heads origin ci-results >/dev/null; then git checkout -q ci-results; else git checkout -q --orphan ci-results; git rm -rfq . || true; fi
            mkdir -p "$D" && cp -r /tmp/res/$D/. "$D/" && git add -A && git commit -qm "CI results $D" && git push -q origin ci-results && break
            cd /; sleep $((RANDOM % 8 + 2))
          done
          git -C /tmp/pub log -1 --format=%s | grep -q "CI results $D" || { echo "::error::results were not pushed"; exit 1; }
