name: EGA CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests-and-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - name: Run reproducible exploratory pilot
        run: ega-run --out results/ci-pilot --seeds 3 --steps 250
      - uses: actions/upload-artifact@v4
        with:
          name: ega-ci-pilot
          path: results/ci-pilot/
          if-no-files-found: error
