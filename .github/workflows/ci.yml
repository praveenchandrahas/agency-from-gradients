name: EGA tests and matched-control simulations
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests-and-simulations:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - name: Run 16-bit paired-seed simulations with matched controls
        run: ega-run --out results/matched-key16 --seeds 10 --steps 300
      - name: Plot paired contrasts
        run: python analysis/plot_results.py results/matched-key16
      - uses: actions/upload-artifact@v4
        with:
          name: ega-matched-key16-results
          path: results/matched-key16/
          if-no-files-found: error
