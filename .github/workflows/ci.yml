name: EGA tests and exploratory simulations
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests-and-simulations:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - name: Run paired-seed exploratory simulations
        run: ega-run --out results/initial-exploratory --seeds 10 --steps 400
      - name: Plot paired contrasts
        run: python analysis/plot_results.py results/initial-exploratory
      - uses: actions/upload-artifact@v4
        with:
          name: ega-initial-exploratory-results
          path: results/initial-exploratory/
          if-no-files-found: error
