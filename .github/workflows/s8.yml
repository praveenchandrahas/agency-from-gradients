name: s8-entropy-objective
# S8 confirmatory: entropy as the objective (PREREGISTRATION_S8.md). One job per kappa.
on:
  workflow_dispatch:
    inputs:
      seeds: { description: "ES runs per kappa (preregistered: 5)", default: "5" }
      seed0: { description: "first ES seed (preregistered: 0)", default: "0" }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        kappa: ["3", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: python -m agency_gradients.experiments.s8_entropy_objective --seeds ${{ inputs.seeds }} --seed0 ${{ inputs.seed0 }} --kappas ${{ matrix.kappa }} --workers 4 --out out
      - uses: actions/upload-artifact@v4
        with: { name: "results-s8-kappa${{ matrix.kappa }}", path: out/ }
      - name: Publish results to the ci-results branch
        if: always()
        run: |
          set -e
          D="runs/${GITHUB_RUN_ID}-s8-kappa${{ matrix.kappa }}"
          mkdir -p /tmp/res/$D && cp -r out/. /tmp/res/$D/ || true
          git config --global user.name "github-actions"; git config --global user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            rm -rf /tmp/pub && git clone --quiet "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/pub
            cd /tmp/pub
            if git ls-remote --exit-code --heads origin ci-results >/dev/null; then git checkout -q ci-results; else git checkout -q --orphan ci-results; git rm -rfq . || true; fi
            mkdir -p "$D" && cp -r /tmp/res/$D/. "$D/" && git add -A && git commit -qm "CI results $D" && git push -q origin ci-results && break
            cd /; sleep $((RANDOM % 8 + 2))
          done
          git -C /tmp/pub log -1 --format=%s | grep -q "CI results $D" || { echo "::error::results were not pushed to ci-results"; exit 1; }
