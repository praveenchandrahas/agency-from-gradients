# Moved from the standalone repository on 2026-11-23. Runs inside gradient-access/.
name: "S16 gradient access: EGA long-horizon matched-control simulations"
# v0.1 was withdrawn after its own audit (gradient-access/VALIDATION_AUDIT.md), so it runs on demand only.
on:
  workflow_dispatch:
defaults:
  run:
    working-directory: gradient-access

jobs:
  tests-and-simulations:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gradient-access/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - name: Run 100-residence-time paired-seed simulations
        run: ega-run --out results/long-horizon-key16 --seeds 10 --steps 300 --duration 100
      - name: Plot paired contrasts
        run: python analysis/plot_results.py results/long-horizon-key16
      - uses: actions/upload-artifact@v4
        with:
          name: ega-long-horizon-key16-results
          path: gradient-access/results/long-horizon-key16/
          if-no-files-found: error
